<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Form and Cookies</title>
</head>
<body>
    <form id="userForm">
        <label for="fio">ФИО:</label>
        <input type="text" id="fio" name="fio" required><br>
        
        <label for="email">Электронная почта:</label>
        <input type="email" id="email" name="email" required><br>
        
        <label for="dob">Дата рождения:</label>
        <input type="date" id="dob" name="dob" required><br>
        
        <label for="birthplace">Место рождения:</label>
        <input type="text" id="birthplace" name="birthplace" required><br>
        
        <label for="hobbies">Увлечения:</label>
        <input type="text" id="hobbies" name="hobbies"><br>
        
        <button type="submit">Отправить</button>
    </form>

    <button id="getCookies">Получить данные из Cookie</button>
    <button id="clearCookies">Очистить Cookie</button>

    <script src="cookies.js"></script>
</body>
</html>
