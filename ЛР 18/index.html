<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма с валидацией</title>
</head>
<body>

    <form id="userForm">
        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" required minlength="3"><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="age">Возраст:</label>
        <input type="number" id="age" name="age" required min="1"><br>

        <label>Пол:</label>
        <input type="radio" id="male" name="gender" value="Мужской">
        <label for="male">Мужской</label>
        <input type="radio" id="female" name="gender" value="Женский">
        <label for="female">Женский</label><br>

        <label>Интересы:</label>
        <input type="checkbox" id="sport" name="interest" value="Спорт">
        <label for="sport">Спорт</label>
        <input type="checkbox" id="music" name="interest" value="Музыка">
        <label for="music">Музыка</label><br>

        <label for="city">Город:</label>
        <select id="city" name="city" required>
            <option value="">Выберите город</option>
            <option value="Минск">Минск</option>
            <option value="Гродно">Гродно</option>
            <option value="Витебск">Витебск</option>
            <option value="Гомель">Гомель</option>
            <option value="Брест">Брест</option>
            <option value="Могилев">Могилев</option>
        </select><br>

        <button type="submit">Отправить</button>
    </form>

    <div id="result"></div>
    <span id="errorMsg" style="color:red"></span><br>


    <script src="form.js"></script>

</body>
</html>
