<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина Интернет-магазина</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #cart {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }

        h2 {
            margin-top: 0;
            color: #343a40;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
        }

        li:last-child {
            border-bottom: none;
        }

        .price {
            font-weight: bold;
            color: #28a745;
        }

        .description, .category {
            font-size: 0.9em;
            color: #6c757d;
        }

        #total-price {
            text-align: right;
            font-size: 1.2em;
            margin-top: 20px;
            color: #17a2b8;
        }
    </style>
</head>
<body>
    <div id="cart">
        <h2>Корзина</h2>
        <ul id="cart-items"></ul>
        <p id="total-price">Общая стоимость: 0.00 руб.</p>
    </div>
    <script src="cart.js"></script>
</body>
</html>
